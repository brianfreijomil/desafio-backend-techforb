# Nombre de la aplicación
spring.application.name=${APP_NAME:desafio-backend}

# Context path
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/challenge-api-db}
